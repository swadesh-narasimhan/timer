<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="50%" stop-color="#0d212b"/>
      <stop offset="100%" stop-color="#122a28"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e07850" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e07850" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="270" r="180" fill="url(#glow)"/>
  <!-- Subtle circular timer ring -->
  <circle cx="256" cy="270" r="140" fill="none" stroke="#e07850" stroke-width="12" stroke-linecap="round" stroke-dasharray="600 280"/>
  <!-- Tomato / Fruit Icon -->
  <text x="256" y="315" font-size="130" text-anchor="middle" dominant-baseline="central">🍅</text>
</svg>
